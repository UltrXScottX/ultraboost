
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew
        working-directory: forcefps

      - name: Build mod
        run: ./gradlew build
        working-directory: forcefps

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: VioletVoid-PvP-Mod
          path: |
            forcefps/build/libs/*.jar
            !forcefps/build/libs/*-sources.jar
            !forcefps/build/libs/*-javadoc.jar
          if-no-files-found: error
          
